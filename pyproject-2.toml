[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locked-saturation-cosmology"
version = "0.1.0"
description = "Reference implementation of equations documented in Locked Gravitational Saturation Cosmology"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.scripts]
locked-saturation = "locked_saturation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
