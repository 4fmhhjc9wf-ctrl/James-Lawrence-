name: Validate Locked Saturation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  locked-saturation-validation:
    name: Locked Saturation validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      WORKFLOW_VERSION: "2026-08-07-validation-isolated-v3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show validation workflow version
        run: |
          set -euo pipefail

          echo "========================================"
          echo "LOCKED SATURATION VALIDATION"
          echo "WORKFLOW VERSION: $WORKFLOW_VERSION"
          echo "COMMIT: $GITHUB_SHA"
          echo "REF: $GITHUB_REF"
          echo "========================================"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy sympy packaging

          echo "Python validation dependencies installed."

      - name: Verify required files
        run: |
          set -euo pipefail

          required_files=(
            src/locked_saturation/__init__.py
            src/locked_saturation/model.py
            src/locked_saturation/validation.py
            test_model.py
            test_locked_arithmetic.py
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required file missing: $f"
              exit 1
            fi

            echo "PRESENT: $f"
          done

          echo "Required-file check PASS"

      - name: Verify Locked Saturation package imports
        run: |
          set -euo pipefail

          python - <<'PY'
          import locked_saturation
          import locked_saturation.model
          import locked_saturation.validation

          print("locked_saturation:")
          print(locked_saturation.__file__)

          print("locked_saturation.model:")
          print(locked_saturation.model.__file__)

          print("locked_saturation.validation:")
          print(locked_saturation.validation.__file__)

          assert "/src/locked_saturation/" in locked_saturation.__file__
          assert "/src/locked_saturation/" in locked_saturation.model.__file__
          assert "/src/locked_saturation/" in locked_saturation.validation.__file__

          print("Locked Saturation package-location check PASS")
          PY

      - name: Verify model imports
        run: |
          set -euo pipefail

          python - <<'PY'
          from locked_saturation.model import (
              ModelParameters,
              potential,
              potential_grad,
              auxiliaries,
              rhs,
          )

          p = ModelParameters()

          print("ModelParameters import PASS")
          print("potential import PASS")
          print("potential_grad import PASS")
          print("auxiliaries import PASS")
          print("rhs import PASS")
          print("Model import verification PASS")
          PY

      - name: Verify locked arithmetic import
        run: |
          set -euo pipefail

          python - <<'PY'
          from locked_saturation.validation import locked_arithmetic

          result = locked_arithmetic()

          if not isinstance(result, dict):
              raise TypeError(
                  "locked_arithmetic() must return a dictionary"
              )

          print("locked_arithmetic import PASS")
          print("locked_arithmetic execution PASS")
          PY

      - name: Prepare isolated pytest directory
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/locked-saturation-tests"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cp "$GITHUB_WORKSPACE/test_model.py" "$TEST_DIR/"
          cp "$GITHUB_WORKSPACE/test_locked_arithmetic.py" "$TEST_DIR/"

          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ISOLATED TEST DIRECTORY"
          echo "========================================"
          echo "$TEST_DIR"

          ls -la "$TEST_DIR"

          if [ -e "$TEST_DIR/__init__.py" ]; then
            echo "ERROR: repository __init__.py leaked into test directory"
            exit 1
          fi

          echo "No root __init__.py present."
          echo "Isolated pytest directory PASS"

      - name: Run Locked Saturation tests
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          echo "========================================"
          echo "RUNNING LOCKED SATURATION TESTS"
          echo "========================================"

          echo "Current working directory:"
          pwd

          echo
          echo "Directory contents:"
          ls -la

          echo
          echo "PYTHONPATH:"
          echo "$PYTHONPATH"

          echo
          echo "Confirming CAMB root __init__.py cannot be collected:"

          if [ -e "__init__.py" ]; then
            echo "ERROR: unexpected __init__.py in test directory"
            exit 1
          fi

          python -m pytest \
            --rootdir="$TEST_DIR" \
            --import-mode=importlib \
            -q \
            test_model.py \
            test_locked_arithmetic.py

          echo "========================================"
          echo "LOCKED SATURATION TESTS PASS"
          echo "========================================"

      - name: Compile Locked Saturation Python sources
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          python -m compileall -q src/locked_saturation
          python -m py_compile test_model.py
          python -m py_compile test_locked_arithmetic.py

          echo "Locked Saturation Python compilation PASS"

      - name: Validation summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDATION COMPLETE"
          echo "========================================"
          echo "Workflow: $WORKFLOW_VERSION"
          echo "Package imports: PASS"
          echo "Model imports: PASS"
          echo "Locked arithmetic execution: PASS"
          echo "Isolated pytest: PASS"
          echo "Python compilation: PASS"
          echo "========================================"
