name: Validate Locked Saturation

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  locked-saturation-validation:
    name: Locked Saturation validation
    runs-on: ubuntu-latest

    env:
      WORKFLOW_VERSION: "validation-v6-verified"
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workflow identity
        run: |
          set -euo pipefail

          echo "========================================"
          echo "LOCKED SATURATION VALIDATION"
          echo "VERSION: $WORKFLOW_VERSION"
          echo "COMMIT: $GITHUB_SHA"
          echo "REF: $GITHUB_REF"
          echo "RUN: $GITHUB_RUN_ID"
          echo "========================================"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest numpy

          echo "Validation dependencies installed."

      - name: Verify required Locked Saturation files
        run: |
          set -euo pipefail

          required_files=(
            src/locked_saturation/__init__.py
            src/locked_saturation/model.py
            src/locked_saturation/validation.py
            test_model.py
            test_locked_arithmetic.py
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required file missing: $f"
              exit 1
            fi

            echo "PRESENT: $f"
          done

          echo "Required-file check PASS"

      - name: Verify Locked Saturation package imports
        run: |
          set -euo pipefail

          python - <<'PY'
          import locked_saturation
          import locked_saturation.model
          import locked_saturation.validation

          from locked_saturation.model import (
              ModelParameters,
              potential,
              potential_grad,
              auxiliaries,
              rhs,
          )

          from locked_saturation.validation import locked_arithmetic

          expected = "/src/locked_saturation/"

          modules = (
              locked_saturation,
              locked_saturation.model,
              locked_saturation.validation,
          )

          for module in modules:
              path = module.__file__.replace("\\", "/")
              print(f"{module.__name__}: {path}")

              if expected not in path:
                  raise RuntimeError(
                      f"Unexpected module location for "
                      f"{module.__name__}: {path}"
                  )

          ModelParameters()

          result = locked_arithmetic()

          if not isinstance(result, dict):
              raise TypeError(
                  "locked_arithmetic() did not return a dictionary"
              )

          print("Locked Saturation package imports PASS")
          print("locked_arithmetic execution PASS")
          PY

      - name: Prepare isolated pytest directory
        run: |
          set -euo pipefail

          test_dir="$RUNNER_TEMP/locked-saturation-tests"

          rm -rf "$test_dir"
          mkdir -p "$test_dir"

          cp \
            "$GITHUB_WORKSPACE/test_model.py" \
            "$test_dir/test_model.py"

          cp \
            "$GITHUB_WORKSPACE/test_locked_arithmetic.py" \
            "$test_dir/test_locked_arithmetic.py"

          echo "TEST_DIR=$test_dir" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ISOLATED PYTEST DIRECTORY"
          echo "========================================"
          echo "$test_dir"

          ls -la "$test_dir"

          if [ -e "$test_dir/__init__.py" ]; then
            echo "ERROR: __init__.py exists in isolated test directory."
            exit 1
          fi

          if [ -e "$test_dir/baseconfig.py" ]; then
            echo "ERROR: CAMB baseconfig.py leaked into test directory."
            exit 1
          fi

          echo "No CAMB package files present."
          echo "Isolation check PASS"

      - name: Run Locked Saturation tests
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          echo "========================================"
          echo "RUNNING LOCKED SATURATION TESTS"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo
          echo "Directory contents:"
          ls -la

          echo
          echo "PYTHONPATH:"
          echo "$PYTHONPATH"

          if [ -e "__init__.py" ]; then
            echo "ERROR: __init__.py unexpectedly present."
            exit 1
          fi

          python -m pytest \
            --rootdir="$TEST_DIR" \
            --import-mode=importlib \
            -q \
            test_model.py \
            test_locked_arithmetic.py

          echo "========================================"
          echo "LOCKED SATURATION TESTS PASS"
          echo "========================================"

      - name: Compile Locked Saturation sources
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          python -m compileall \
            -q \
            src/locked_saturation

          python -m py_compile \
            test_model.py \
            test_locked_arithmetic.py

          echo "Python compilation PASS"

      - name: Verify repository was not modified
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: validation workflow modified repository files."
            git status --short
            exit 1
          fi

          echo "Repository remained unchanged."
          echo "Read-only validation PASS"

      - name: Validation summary
        run: |
          echo "========================================"
          echo "LOCKED SATURATION VALIDATION PASS"
          echo "========================================"
          echo "Workflow: $WORKFLOW_VERSION"
          echo "Required files: PASS"
          echo "Imports: PASS"
          echo "Locked arithmetic: PASS"
          echo "Isolated pytest: PASS"
          echo "Python compilation: PASS"
          echo "Repository unchanged: PASS"
          echo "========================================"
