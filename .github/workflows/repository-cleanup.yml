name: Repository cleanup and validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Clean repository safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure runtime paths
        run: |
          set -euo pipefail

          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          echo "FORUTILSPATH=$GITHUB_WORKSPACE/../forutils" >> "$GITHUB_ENV"
          echo "CAMB_BUILD_DIR=$RUNNER_TEMP/camb-build" >> "$GITHUB_ENV"
          echo "PYCAMB_OUTPUT_DIR=$RUNNER_TEMP/pycamb-output" >> "$GITHUB_ENV"

      - name: Configure Git and create cleanup branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="cleanup/repository-structure-${GITHUB_RUN_ID}"

          echo "CLEANUP_BRANCH=$branch" >> "$GITHUB_ENV"

          git checkout -b "$branch"

          echo "Cleanup branch: $branch"

      - name: Create cleanup directories
        run: |
          set -euo pipefail

          mkdir -p docs/research-notes
          mkdir -p docs/reviewer
          mkdir -p docs/reports
          mkdir -p notebooks
          mkdir -p results/diagnostics
          mkdir -p archive/duplicate-files

          echo "Repository folders created."

      - name: Move dated research notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in 2026-*.md; do
            git mv "$f" docs/research-notes/
          done

      - name: Move notebooks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in *.ipynb; do
            git mv "$f" notebooks/
          done

      - name: Move reviewer documents
        shell: bash
        run: |
          set -euo pipefail

          files=(
            Executive_Summary.pdf
            Independent_Reviewer_Guide.pdf
            Reviewer_Roadmap.pdf
            Reproduction_Guide.pdf
            Technical_Synopsis.pdf
            QA_Audit.pdf
          )

          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              git mv "$f" docs/reviewer/
            fi
          done

      - name: Move remaining root PDFs and TEX files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in *.pdf; do
            git mv "$f" docs/reports/
          done

          for f in *.tex; do
            git mv "$f" docs/reports/
          done

      - name: Move generated result files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in final_*.csv; do
            git mv "$f" results/diagnostics/
          done

          for f in final_*.json; do
            git mv "$f" results/diagnostics/
          done

          for f in *_diagnostics.json; do
            git mv "$f" results/diagnostics/
          done

          for f in *_results.csv; do
            git mv "$f" results/diagnostics/
          done

          for f in *_results.json; do
            git mv "$f" results/diagnostics/
          done

      - name: Archive obvious duplicate files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in README-[0-9]*.md; do
            git mv "$f" archive/duplicate-files/
          done

          for f in CHANGELOG-[0-9]*.md; do
            git mv "$f" archive/duplicate-files/
          done

          for f in CONTRIBUTING-[0-9]*.md; do
            git mv "$f" archive/duplicate-files/
          done

          for f in Makefile-[0-9]*; do
            git mv "$f" archive/duplicate-files/
          done

          for f in pyproject-[0-9]*.toml; do
            git mv "$f" archive/duplicate-files/
          done

      - name: Verify build-critical files
        run: |
          set -euo pipefail

          critical_files=(
            Makefile
            Makefile_main
            setup.py
            pyproject.toml
            sat_locked_background.inc
            equations.f90
            camb.f90
            camb_python.f90
            test_model.py
            test_locked_arithmetic.py
          )

          for f in "${critical_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "CRITICAL FILE MISSING: $f"
              exit 1
            fi

            echo "PRESENT: $f"
          done

          echo "Critical-file safety check PASS"

      - name: Review cleanup
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CLEANUP CHANGES"
          echo "========================================"

          git status --short

          echo
          git diff --stat

      - name: Commit cleanup locally
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "No cleanup changes were necessary."
            exit 0
          fi

          git commit -m "chore: organize repository structure"

          echo "Cleanup commit created locally."

      - name: Set up Python
        if: env.NO_CHANGES != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python validation dependencies
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy sympy packaging

          echo "Python validation dependencies installed."

      - name: Verify Locked Saturation imports
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          python -c "from locked_saturation.model import ModelParameters, potential, potential_grad, auxiliaries, rhs; print('locked_saturation.model import PASS')"

          python -c "from locked_saturation.validation import locked_arithmetic; print('locked arithmetic import PASS')"

      - name: Run Locked Saturation tests
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          test_dir="$RUNNER_TEMP/locked-saturation-tests"

          rm -rf "$test_dir"
          mkdir -p "$test_dir"

          cp test_model.py "$test_dir/"
          cp test_locked_arithmetic.py "$test_dir/"

          cd "$test_dir"

          pytest -q \
            test_model.py \
            test_locked_arithmetic.py

          echo "Locked Saturation tests PASS"

      - name: Compile Python sources
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          python -m compileall -q src/locked_saturation
          python -m py_compile test_model.py
          python -m py_compile test_locked_arithmetic.py

          echo "Python syntax PASS"

      - name: Install Fortran build toolchain
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gfortran make git curl

          gfortran --version
          make --version

      - name: Fetch forutils
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          rm -rf "$FORUTILSPATH"

          git clone \
            --depth=1 \
            https://github.com/cmbant/forutils.git \
            "$FORUTILSPATH"

          test -f "$FORUTILSPATH/Makefile"

          echo "forutils checkout PASS"

      - name: Restore RungeKuttaDP45 if required
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if [ ! -f RungeKuttaDP45.f90 ]; then
            curl \
              --fail \
              --location \
              https://raw.githubusercontent.com/cmbant/CAMB/2.0.1/fortran/RungeKuttaDP45.f90 \
              --output RungeKuttaDP45.f90
          fi

          test -f RungeKuttaDP45.f90

          echo "RungeKuttaDP45 check PASS"

      - name: Prepare CAMB build directories
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          rm -rf "$CAMB_BUILD_DIR"
          rm -rf "$PYCAMB_OUTPUT_DIR"

          mkdir -p "$CAMB_BUILD_DIR/forutils/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Release"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debug"

          mkdir -p "$CAMB_BUILD_DIR/camb/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Release"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debug"

          mkdir -p "$PYCAMB_OUTPUT_DIR"

          echo "CAMB build directories ready."

      - name: Build full CAMB Fortran library
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR"

          test -s "$PYCAMB_OUTPUT_DIR/camblib.so"

          ls -lh "$PYCAMB_OUTPUT_DIR/camblib.so"
          file "$PYCAMB_OUTPUT_DIR/camblib.so"

          echo "FULL CAMB FORTRAN BUILD PASS"

      - name: Push validated cleanup branch
        if: env.NO_CHANGES != 'true'
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git push \
            --set-upstream \
            origin \
            "$CLEANUP_BRANCH"

          echo "========================================"
          echo "CLEANUP COMPLETE"
          echo "========================================"
          echo "Validated branch pushed:"
          echo "$CLEANUP_BRANCH"
