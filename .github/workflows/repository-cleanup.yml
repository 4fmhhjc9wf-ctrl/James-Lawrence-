name: Repository cleanup and validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Clean repository safely
    runs-on: ubuntu-latest

    env:
      WORKFLOW_VERSION: "cleanup-v7-final"
      PYTHONPATH: ${{ github.workspace }}/src
      FORUTILSPATH: ${{ github.workspace }}/../forutils
      CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
      PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workflow identity
        run: |
          set -euo pipefail

          echo "========================================"
          echo "REPOSITORY CLEANUP WORKFLOW"
          echo "VERSION: $WORKFLOW_VERSION"
          echo "COMMIT: $GITHUB_SHA"
          echo "REF: $GITHUB_REF"
          echo "RUN: $GITHUB_RUN_ID"
          echo "========================================"

      # ============================================================
      # SAFE CLEANUP BRANCH
      # ============================================================

      - name: Configure Git and create cleanup branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="cleanup/repository-structure-${GITHUB_RUN_ID}"

          echo "CLEANUP_BRANCH=$branch" >> "$GITHUB_ENV"

          git checkout -b "$branch"

          echo "Cleanup branch created:"
          echo "$branch"

      # ============================================================
      # REMOVE THE OBSOLETE DUPLICATE WORKFLOW
      # ============================================================

      - name: Remove obsolete Locked Saturation validation workflow
        run: |
          set -euo pipefail

          obsolete=".github/workflows/validate-locked-saturation.yml"

          if [ -f "$obsolete" ]; then
            git rm "$obsolete"

            echo "========================================"
            echo "REMOVED OBSOLETE WORKFLOW"
            echo "$obsolete"
            echo "========================================"
          else
            echo "Obsolete workflow is already absent:"
            echo "$obsolete"
          fi

      # ============================================================
      # CREATE CLEAN DIRECTORY STRUCTURE
      # ============================================================

      - name: Create cleanup directories
        run: |
          set -euo pipefail

          mkdir -p \
            docs/research-notes \
            docs/reviewer \
            docs/reports \
            notebooks \
            results/diagnostics \
            archive/duplicate-files

          echo "Cleanup directories ready."

      # ============================================================
      # MOVE DATED RESEARCH NOTES
      # ============================================================

      - name: Move dated research notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in 2026-*.md; do
            git mv "$f" docs/research-notes/
            echo "Moved: $f"
          done

      # ============================================================
      # MOVE NOTEBOOKS
      # ============================================================

      - name: Move notebooks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in *.ipynb; do
            git mv "$f" notebooks/
            echo "Moved: $f"
          done

      # ============================================================
      # MOVE REVIEWER DOCUMENTS
      # ============================================================

      - name: Move reviewer documents
        shell: bash
        run: |
          set -euo pipefail

          files=(
            Executive_Summary.pdf
            Independent_Reviewer_Guide.pdf
            Reviewer_Roadmap.pdf
            Reproduction_Guide.pdf
            Technical_Synopsis.pdf
            QA_Audit.pdf
          )

          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              git mv "$f" docs/reviewer/
              echo "Moved reviewer document: $f"
            fi
          done

      # ============================================================
      # MOVE REMAINING ROOT REPORTS
      # ============================================================

      - name: Move remaining root PDFs and TEX files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in *.pdf; do
            git mv "$f" docs/reports/
            echo "Moved report: $f"
          done

          for f in *.tex; do
            git mv "$f" docs/reports/
            echo "Moved TEX source: $f"
          done

      # ============================================================
      # MOVE GENERATED RESULTS
      # ============================================================

      - name: Move generated result files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in \
            final_*.csv \
            final_*.json \
            *_diagnostics.json \
            *_results.csv \
            *_results.json
          do
            [ -e "$f" ] || continue

            git mv "$f" results/diagnostics/

            echo "Moved generated result: $f"
          done

      # ============================================================
      # ARCHIVE OBVIOUS DUPLICATES
      # ============================================================

      - name: Archive obvious duplicate files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in \
            README-[0-9]*.md \
            CHANGELOG-[0-9]*.md \
            CONTRIBUTING-[0-9]*.md \
            Makefile-[0-9]* \
            pyproject-[0-9]*.toml
          do
            [ -e "$f" ] || continue

            git mv "$f" archive/duplicate-files/

            echo "Archived duplicate: $f"
          done

      # ============================================================
      # PROTECT BUILD / MODEL FILES
      # ============================================================

      - name: Verify build-critical files
        run: |
          set -euo pipefail

          critical_files=(
            Makefile
            Makefile_main
            setup.py
            pyproject.toml
            sat_locked_background.inc
            equations.f90
            camb.f90
            camb_python.f90
            test_model.py
            test_locked_arithmetic.py
            src/locked_saturation/__init__.py
            src/locked_saturation/model.py
            src/locked_saturation/validation.py
          )

          for f in "${critical_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "========================================"
              echo "CRITICAL FILE MISSING"
              echo "$f"
              echo "========================================"
              exit 1
            fi

            echo "PRESENT: $f"
          done

          echo "========================================"
          echo "CRITICAL-FILE SAFETY CHECK PASS"
          echo "========================================"

      # ============================================================
      # MAKE SURE BAD WORKFLOW IS GONE
      # ============================================================

      - name: Verify obsolete workflow removal
        run: |
          set -euo pipefail

          obsolete=".github/workflows/validate-locked-saturation.yml"

          if [ -e "$obsolete" ]; then
            echo "ERROR: obsolete workflow still exists:"
            echo "$obsolete"
            exit 1
          fi

          echo "Obsolete workflow removal PASS."

      # ============================================================
      # REVIEW CLEANUP
      # ============================================================

      - name: Review cleanup
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CLEANUP STATUS"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "CLEANUP DIFF STAT"
          echo "========================================"

          git diff --stat

      # ============================================================
      # COMMIT CLEANUP LOCALLY FIRST
      # ============================================================

      - name: Commit cleanup locally
        id: cleanup_commit
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No cleanup changes were necessary."
          else
            git commit \
              -m "chore: clean repository and remove obsolete validation workflow"

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Cleanup commit created locally."
          fi

      # ============================================================
      # PYTHON SETUP
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python validation dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest numpy

          echo "Python validation dependencies installed."

      # ============================================================
      # VERIFY LOCKED SATURATION PACKAGE
      # ============================================================

      - name: Verify Locked Saturation imports
        run: |
          set -euo pipefail

          python - <<'PY'
          import locked_saturation
          import locked_saturation.model
          import locked_saturation.validation

          from locked_saturation.model import (
              ModelParameters,
              potential,
              potential_grad,
              auxiliaries,
              rhs,
          )

          from locked_saturation.validation import locked_arithmetic

          expected = "/src/locked_saturation/"

          modules = (
              locked_saturation,
              locked_saturation.model,
              locked_saturation.validation,
          )

          for module in modules:
              path = module.__file__.replace("\\", "/")

              print(f"{module.__name__}: {path}")

              if expected not in path:
                  raise RuntimeError(
                      f"Unexpected Locked Saturation module location: {path}"
                  )

          ModelParameters()

          result = locked_arithmetic()

          if not isinstance(result, dict):
              raise TypeError(
                  "locked_arithmetic() did not return a dictionary"
              )

          print("ModelParameters construction PASS")
          print("Locked arithmetic execution PASS")
          print("Locked Saturation imports PASS")
          PY

      # ============================================================
      # ISOLATED PYTEST
      # THIS PREVENTS CAMB ROOT __init__.py FROM BEING COLLECTED
      # ============================================================

      - name: Run Locked Saturation tests in isolated directory
        run: |
          set -euo pipefail

          test_dir="$RUNNER_TEMP/locked-saturation-tests"

          rm -rf "$test_dir"
          mkdir -p "$test_dir"

          cp \
            "$GITHUB_WORKSPACE/test_model.py" \
            "$test_dir/test_model.py"

          cp \
            "$GITHUB_WORKSPACE/test_locked_arithmetic.py" \
            "$test_dir/test_locked_arithmetic.py"

          cd "$test_dir"

          echo "========================================"
          echo "ISOLATED LOCKED SATURATION TESTS"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo
          echo "Files:"
          ls -la

          echo
          echo "PYTHONPATH:"
          echo "$PYTHONPATH"

          if [ -e "__init__.py" ]; then
            echo "ERROR: __init__.py leaked into isolated test directory."
            exit 1
          fi

          if [ -e "baseconfig.py" ]; then
            echo "ERROR: CAMB baseconfig.py leaked into isolated test directory."
            exit 1
          fi

          python -m pytest \
            --rootdir="$test_dir" \
            --import-mode=importlib \
            -q \
            test_model.py \
            test_locked_arithmetic.py

          echo "========================================"
          echo "LOCKED SATURATION TESTS PASS"
          echo "========================================"

      # ============================================================
      # COMPILE PYTHON SOURCES
      # ============================================================

      - name: Compile Locked Saturation Python sources
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          python -m compileall \
            -q \
            src/locked_saturation

          python -m py_compile \
            test_model.py \
            test_locked_arithmetic.py

          echo "Python compilation PASS."

      # ============================================================
      # INSTALL FORTRAN BUILD TOOLS
      # ============================================================

      - name: Install Fortran build toolchain
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            gfortran \
            make \
            git \
            curl

          echo "========================================"
          echo "BUILD TOOL VERSIONS"
          echo "========================================"

          gfortran --version
          make --version
          git --version

      # ============================================================
      # FETCH FORUTILS
      # ============================================================

      - name: Fetch forutils
        run: |
          set -euo pipefail

          rm -rf "$FORUTILSPATH"

          git clone \
            --depth=1 \
            https://github.com/cmbant/forutils.git \
            "$FORUTILSPATH"

          if [ ! -f "$FORUTILSPATH/Makefile" ]; then
            echo "ERROR: forutils Makefile not found."
            exit 1
          fi

          echo "forutils checkout PASS."

      # ============================================================
      # TEMPORARILY RESTORE RUNGEKUTTADP45 IF NEEDED
      # ============================================================

      - name: Restore RungeKuttaDP45 temporarily if required
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if [ -s RungeKuttaDP45.f90 ]; then
            echo "RUNGEKUTTA_TEMPORARY=false" >> "$GITHUB_ENV"
            echo "RungeKuttaDP45.f90 already present."
          else
            echo "RungeKuttaDP45.f90 is absent."
            echo "Downloading temporary CAMB 2.0.1 copy for build validation."

            curl \
              --fail \
              --location \
              https://raw.githubusercontent.com/cmbant/CAMB/2.0.1/fortran/RungeKuttaDP45.f90 \
              --output RungeKuttaDP45.f90

            echo "RUNGEKUTTA_TEMPORARY=true" >> "$GITHUB_ENV"
          fi

          if [ ! -s RungeKuttaDP45.f90 ]; then
            echo "ERROR: RungeKuttaDP45.f90 unavailable."
            exit 1
          fi

          echo "RungeKuttaDP45 build-source check PASS."

      # ============================================================
      # PREPARE TEMP CAMB BUILD DIRECTORIES
      # ============================================================

      - name: Prepare CAMB build directories
        run: |
          set -euo pipefail

          rm -rf \
            "$CAMB_BUILD_DIR" \
            "$PYCAMB_OUTPUT_DIR"

          mkdir -p \
            "$CAMB_BUILD_DIR/forutils/Releaselib" \
            "$CAMB_BUILD_DIR/forutils/Debuglib" \
            "$CAMB_BUILD_DIR/forutils/Release" \
            "$CAMB_BUILD_DIR/forutils/Debug" \
            "$CAMB_BUILD_DIR/camb/Releaselib" \
            "$CAMB_BUILD_DIR/camb/Debuglib" \
            "$CAMB_BUILD_DIR/camb/Release" \
            "$CAMB_BUILD_DIR/camb/Debug" \
            "$PYCAMB_OUTPUT_DIR"

          echo "========================================"
          echo "CAMB BUILD PATHS"
          echo "========================================"

          echo "FORUTILSPATH=$FORUTILSPATH"
          echo "CAMB_BUILD_DIR=$CAMB_BUILD_DIR"
          echo "PYCAMB_OUTPUT_DIR=$PYCAMB_OUTPUT_DIR"

      # ============================================================
      # FULL CAMB BUILD
      # ============================================================

      - name: Build full CAMB Fortran library
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "BUILDING FULL CAMB FORTRAN LIBRARY"
          echo "========================================"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR"

          output="$PYCAMB_OUTPUT_DIR/camblib.so"

          if [ ! -s "$output" ]; then
            echo "ERROR: CAMB build did not produce camblib.so."
            exit 1
          fi

          echo
          echo "CAMB output:"

          ls -lh "$output"

          file "$output"

          echo "========================================"
          echo "FULL CAMB FORTRAN BUILD PASS"
          echo "========================================"

      # ============================================================
      # REMOVE TEMPORARY BUILD SOURCE
      # ============================================================

      - name: Remove temporary RungeKuttaDP45 source
        if: always()
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if [ "${RUNGEKUTTA_TEMPORARY:-false}" = "true" ]; then
            rm -f RungeKuttaDP45.f90
            echo "Removed temporary RungeKuttaDP45.f90."
          else
            echo "No temporary RungeKuttaDP45 source to remove."
          fi

      # ============================================================
      # FINAL WORKTREE SAFETY CHECK
      # ============================================================

      - name: Verify validation did not alter cleanup commit
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "FINAL GIT STATUS"
          echo "========================================"

          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo
            echo "ERROR: validation/build created unexpected repository changes."
            exit 1
          fi

          echo
          echo "Validation left the cleanup commit unchanged."

      # ============================================================
      # PUSH ONLY AFTER ALL VALIDATION PASSES
      # ============================================================

      - name: Push validated cleanup branch
        if: steps.cleanup_commit.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git push \
            --set-upstream \
            origin \
            "$CLEANUP_BRANCH"

          echo "========================================"
          echo "VALIDATED CLEANUP BRANCH PUSHED"
          echo "========================================"

          echo "$CLEANUP_BRANCH"

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final cleanup summary
        run: |
          echo "========================================"
          echo "REPOSITORY CLEANUP VALIDATION COMPLETE"
          echo "========================================"

          echo "Workflow version: $WORKFLOW_VERSION"

          echo
          echo "Obsolete validate workflow: REMOVED"
          echo "Critical repository files: PRESERVED"
          echo "Locked Saturation imports: PASS"
          echo "Locked Saturation tests: PASS"
          echo "Python compilation: PASS"
          echo "CAMB Fortran build: PASS"
          echo "Temporary build files: REMOVED"

          if [ "${{ steps.cleanup_commit.outputs.changed }}" = "true" ]; then
            echo "Cleanup branch: PUSHED"
            echo "$CLEANUP_BRANCH"
          else
            echo "Cleanup branch: NO CHANGES REQUIRED"
          fi

          echo "========================================"
