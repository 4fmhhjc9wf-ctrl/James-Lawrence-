name: Repository cleanup and validation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    name: Clean repository safely
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
      PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
      FORUTILSPATH: ${{ github.workspace }}/../forutils

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="cleanup/repository-structure-${GITHUB_RUN_ID}"
          echo "CLEANUP_BRANCH=$branch" >> "$GITHUB_ENV"

          git checkout -b "$branch"

          echo "Cleanup branch: $branch"

      - name: Create repository structure
        run: |
          set -euo pipefail

          mkdir -p docs/reviewer
          mkdir -p docs/reports
          mkdir -p docs/research-notes
          mkdir -p notebooks
          mkdir -p results/diagnostics
          mkdir -p archive/duplicate-files

          echo "DIRECTORY STRUCTURE CREATED"

      - name: Move safe non-build files
        run: |
          set -euo pipefail
          shopt -s nullglob

          manifest="docs/CLEANUP_MANIFEST.md"

          {
            echo "# Repository Cleanup Manifest"
            echo
            echo "Generated by GitHub Actions."
            echo
            echo "Build-critical CAMB/Fortran files were deliberately left in place."
            echo
            echo "## Moved files"
            echo
          } > "$manifest"

          move_file() {
            src="$1"
            dest_dir="$2"

            if [ ! -f "$src" ]; then
              return 0
            fi

            mkdir -p "$dest_dir"

            dest="$dest_dir/$(basename "$src")"

            if [ -e "$dest" ]; then
              echo "SKIP existing destination: $dest"
              return 0
            fi

            git mv "$src" "$dest"
            echo "- \`$src\` → \`$dest\`" >> "$manifest"
            echo "MOVED $src -> $dest"
          }

          echo "========================================"
          echo "DATED RESEARCH NOTES"
          echo "========================================"

          for f in 2026-*.md; do
            move_file "$f" "docs/research-notes"
          done

          echo "========================================"
          echo "NOTEBOOKS"
          echo "========================================"

          for f in *.ipynb; do
            move_file "$f" "notebooks"
          done

          echo "========================================"
          echo "REVIEWER DOCUMENTS"
          echo "========================================"

          reviewer_files=(
            "Executive_Summary.pdf"
            "Independent_Reviewer_Guide.pdf"
            "Reviewer_Roadmap.pdf"
            "Reproduction_Guide.pdf"
            "Technical_Synopsis.pdf"
            "QA_Audit.pdf"
          )

          for f in "${reviewer_files[@]}"; do
            move_file "$f" "docs/reviewer"
          done

          echo "========================================"
          echo "OTHER ROOT PDF REPORTS"
          echo "========================================"

          for f in *.pdf; do
            move_file "$f" "docs/reports"
          done

          echo "========================================"
          echo "ROOT TEX DOCUMENTS"
          echo "========================================"

          for f in *.tex; do
            move_file "$f" "docs/reports"
          done

          echo "========================================"
          echo "GENERATED RESULTS"
          echo "========================================"

          result_files=(
            final_*.csv
            final_*.json
            *_diagnostics.json
            *_diagnostics-*.json
            *_results.csv
            *_results.json
          )

          for f in "${result_files[@]}"; do
            move_file "$f" "results/diagnostics"
          done

          echo "========================================"
          echo "OBVIOUS NUMBERED DUPLICATES"
          echo "========================================"

          for f in *; do
            [ -f "$f" ] || continue

            if [[ "$f" =~ ^(.+)-([0-9]+)(\.[^.]+)$ ]]; then
              base="${BASH_REMATCH[1]}${BASH_REMATCH[3]}"

              if [ -f "$base" ]; then
                case "$f" in
                  *.md|*.py|*.toml|*.json|*.csv|*.rst)
                    move_file "$f" "archive/duplicate-files"
                    ;;
                esac
              fi
            fi
          done

          for f in Makefile-[0-9]*; do
            if [ -f "$f" ] && [ -f Makefile ]; then
              move_file "$f" "archive/duplicate-files"
            fi
          done

          echo
          echo "SAFE FILE ORGANIZATION COMPLETE"

      - name: Verify build-critical files were not moved
        run: |
          set -euo pipefail

          critical_files=(
            Makefile
            Makefile_main
            Makefile_compiler
            setup.py
            pyproject.toml
            sat_locked_background.inc
            equations.f90
            camb.f90
            camb_python.f90
            constants.f90
            config.f90
            classes.f90
            MathUtils.f90
            DarkAge21cm.f90
            DarkEnergyInterface.f90
            SourceWindows.f90
            massive_neutrinos.f90
            model.f90
            results.f90
            bessels.f90
            hyperspherical_bessels.f90
            hyperspherical_bessels_airy.f90
            hyperspherical_bessels_smallnu.f90
            hyperspherical_bessels_olver.f90
            recfast.f90
            DarkEnergyFluid.f90
            DarkEnergyPPF.f90
            PowellMinimize.f90
            DarkEnergyQuintessence.f90
            reionization.f90
            InitialPower.f90
            halofit.f90
            SPkNonLinear.f90
            SecondOrderPK.f90
            ExternalNonLinearRatio.f90
            lensing.f90
            SeparableBispectrum.f90
            cmbmain.f90
            test_model.py
            test_locked_arithmetic.py
          )

          failed=0

          for f in "${critical_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "CRITICAL FILE MISSING: $f"
              failed=1
            else
              echo "PRESENT $f"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "CRITICAL FILE SAFETY CHECK FAILED"
            exit 1
          fi

          echo "CRITICAL FILE SAFETY CHECK PASS"

      - name: Review proposed cleanup
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PROPOSED CLEANUP"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "SUMMARY"
          echo "========================================"

          git diff --stat

          echo
          echo "No files have been pushed yet."

      - name: Commit cleanup locally
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No repository cleanup changes were necessary."
            echo "NO_CLEANUP_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "chore: organize repository structure"

          echo "LOCAL CLEANUP COMMIT CREATED"
          echo "Nothing has been pushed yet."

      - name: Set up Python
        if: env.NO_CLEANUP_CHANGES != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Locked Saturation Python model
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy sympy packaging

          echo "========================================"
          echo "VERIFY MODEL IMPORT"
          echo "========================================"

          python -c \
            "from locked_saturation.model import ModelParameters, potential, potential_grad, auxiliaries, rhs; print('locked_saturation.model import PASS')"

          echo "========================================"
          echo "VERIFY VALIDATION IMPORT"
          echo "========================================"

          python -c \
            "from locked_saturation.validation import locked_arithmetic; print('locked arithmetic import PASS')"

          echo "========================================"
          echo "RUN LOCKED TESTS"
          echo "========================================"

          mkdir -p /tmp/locked-saturation-tests

          cp test_model.py /tmp/locked-saturation-tests/
          cp test_locked_arithmetic.py /tmp/locked-saturation-tests/

          cd /tmp/locked-saturation-tests

          pytest -q \
            test_model.py \
            test_locked_arithmetic.py

          echo "LOCKED SATURATION PYTHON VALIDATION PASS"

      - name: Compile Locked Saturation Python syntax
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          python -m compileall -q src/locked_saturation
          python -m py_compile test_model.py
          python -m py_compile test_locked_arithmetic.py

          echo "PYTHON SYNTAX PASS"

      - name: Install Fortran build toolchain
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gfortran make git curl

          gfortran --version
          make --version

      - name: Fetch forutils
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          rm -rf ../forutils

          git clone \
            --depth=1 \
            https://github.com/cmbant/forutils.git \
            ../forutils

          test -s ../forutils/Makefile

          echo "FORUTILS CHECKOUT PASS"

      - name: Restore missing official CAMB build source if required
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          if [ ! -s RungeKuttaDP45.f90 ]; then
            echo "Restoring RungeKuttaDP45.f90 for validation only"

            curl \
              --fail \
              --location \
              --retry 3 \
              https://raw.githubusercontent.com/cmbant/CAMB/2.0.1/fortran/RungeKuttaDP45.f90 \
              --output RungeKuttaDP45.f90

            test -s RungeKuttaDP45.f90
          fi

          echo "FORTRAN SOURCE CHECK PASS"

      - name: Prepare CAMB build directories
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          rm -rf "$CAMB_BUILD_DIR"
          rm -rf "$PYCAMB_OUTPUT_DIR"

          mkdir -p "$CAMB_BUILD_DIR/forutils/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Release"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debug"

          mkdir -p "$CAMB_BUILD_DIR/camb/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Release"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debug"

          mkdir -p "$PYCAMB_OUTPUT_DIR"

          test -d "$CAMB_BUILD_DIR/forutils/Releaselib"
          test -d "$CAMB_BUILD_DIR/camb/Releaselib"
          test -d "$PYCAMB_OUTPUT_DIR"

          echo "CAMB BUILD DIRECTORY CHECK PASS"

      - name: Full CAMB Fortran validation build
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FULL CAMB FORTRAN VALIDATION"
          echo "========================================"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR"

          library="$PYCAMB_OUTPUT_DIR/camblib.so"

          if [ ! -s "$library" ]; then
            echo "camblib.so was not produced."
            exit 1
          fi

          ls -lh "$library"
          file "$library"

          echo "FULL CAMB FORTRAN BUILD PASS"

      - name: Confirm cleanup commit stayed clean
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          echo "Validation may create temporary untracked build inputs."
          echo "They will NOT be added to the cleanup commit."

          echo
          echo "Cleanup commit:"
          git show --stat --oneline HEAD

          echo
          echo "Files outside the commit after validation:"
          git status --short || true

          echo
          echo "VALIDATION COMPLETE"

      - name: Push validated cleanup branch
        if: env.NO_CLEANUP_CHANGES != 'true'
        run: |
          set -euo pipefail

          git push \
            --set-upstream \
            origin \
            "$CLEANUP_BRANCH"

          echo "========================================"
          echo "VALIDATED CLEANUP BRANCH PUSHED"
          echo "========================================"
          echo "$CLEANUP_BRANCH"

      - name: Open cleanup pull request
        if: env.NO_CLEANUP_CHANGES != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          body="$(cat <<'EOF'
          ## Repository structure cleanup

          This PR organizes non-build repository material while preserving the working CAMB/Fortran source layout.

          ### Organization

          - research notes → `docs/research-notes/`
          - reviewer documents → `docs/reviewer/`
          - reports and technical PDFs/TEX → `docs/reports/`
          - notebooks → `notebooks/`
          - generated diagnostic results → `results/diagnostics/`
          - obvious numbered duplicate files → `archive/duplicate-files/`

          ### Safety

          No build-critical CAMB/Fortran files were intentionally moved.

          Before this branch was pushed, GitHub Actions successfully ran:

          - Locked Saturation model imports
          - Locked Saturation arithmetic import
          - `test_model.py`
          - `test_locked_arithmetic.py`
          - Python syntax compilation
          - full recovered CAMB Fortran build
          - `camblib.so` verification

          Nothing in `archive/duplicate-files/` has been deleted.
          EOF
          )"

          if gh pr create \
            --base main \
            --head "$CLEANUP_BRANCH" \
            --title "chore: organize repository structure" \
            --body "$body"; then

            echo "CLEANUP PULL REQUEST CREATED"

          else
            echo
            echo "The cleanup branch was pushed successfully,"
            echo "but GitHub did not allow Actions to create the PR automatically."
            echo
            echo "Branch:"
            echo "$CLEANUP_BRANCH"
            echo
            echo "You can open the PR manually from GitHub."
          fi
