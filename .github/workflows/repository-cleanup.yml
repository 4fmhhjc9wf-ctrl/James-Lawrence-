name: Repository cleanup and validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Clean repository safely
    runs-on: ubuntu-latest

    env:
      WORKFLOW_VERSION: "cleanup-v5-verified"
      PYTHONPATH: ${{ github.workspace }}/src
      FORUTILSPATH: ${{ github.workspace }}/../forutils
      CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
      PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workflow identity
        run: |
          set -euo pipefail
          echo "REPOSITORY CLEANUP WORKFLOW"
          echo "VERSION: $WORKFLOW_VERSION"
          echo "COMMIT: $GITHUB_SHA"
          echo "REF: $GITHUB_REF"
          echo "RUN: $GITHUB_RUN_ID"

      - name: Configure Git and create cleanup branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="cleanup/repository-structure-${GITHUB_RUN_ID}"
          echo "CLEANUP_BRANCH=$branch" >> "$GITHUB_ENV"

          git checkout -b "$branch"

      - name: Create cleanup directories
        run: |
          set -euo pipefail

          mkdir -p \
            docs/research-notes \
            docs/reviewer \
            docs/reports \
            notebooks \
            results/diagnostics \
            archive/duplicate-files

      - name: Move dated research notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in 2026-*.md; do
            git mv "$f" docs/research-notes/
          done

      - name: Move notebooks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in *.ipynb; do
            git mv "$f" notebooks/
          done

      - name: Move reviewer documents
        shell: bash
        run: |
          set -euo pipefail

          files=(
            Executive_Summary.pdf
            Independent_Reviewer_Guide.pdf
            Reviewer_Roadmap.pdf
            Reproduction_Guide.pdf
            Technical_Synopsis.pdf
            QA_Audit.pdf
          )

          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              git mv "$f" docs/reviewer/
            fi
          done

      - name: Move remaining root PDFs and TEX files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in *.pdf; do
            git mv "$f" docs/reports/
          done

          for f in *.tex; do
            git mv "$f" docs/reports/
          done

      - name: Move generated result files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in \
            final_*.csv \
            final_*.json \
            *_diagnostics.json \
            *_results.csv \
            *_results.json
          do
            [ -e "$f" ] || continue
            git mv "$f" results/diagnostics/
          done

      - name: Archive obvious duplicate files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in \
            README-[0-9]*.md \
            CHANGELOG-[0-9]*.md \
            CONTRIBUTING-[0-9]*.md \
            Makefile-[0-9]* \
            pyproject-[0-9]*.toml
          do
            [ -e "$f" ] || continue
            git mv "$f" archive/duplicate-files/
          done

      - name: Verify build-critical files
        run: |
          set -euo pipefail

          critical_files=(
            Makefile
            Makefile_main
            setup.py
            pyproject.toml
            sat_locked_background.inc
            equations.f90
            camb.f90
            camb_python.f90
            test_model.py
            test_locked_arithmetic.py
            src/locked_saturation/__init__.py
            src/locked_saturation/model.py
            src/locked_saturation/validation.py
          )

          for f in "${critical_files[@]}"; do
            test -f "$f" || {
              echo "CRITICAL FILE MISSING: $f"
              exit 1
            }

            echo "PRESENT: $f"
          done

      - name: Review cleanup
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CLEANUP CHANGES"
          echo "========================================"

          git status --short
          git diff --stat

      - name: Commit cleanup locally
        id: cleanup_commit
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No cleanup changes were necessary."
          else
            git commit -m "chore: organize repository structure"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python validation dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy sympy packaging

      - name: Verify Locked Saturation imports
        run: |
          set -euo pipefail

          python - <<'PY'
          import locked_saturation
          import locked_saturation.model
          import locked_saturation.validation

          from locked_saturation.model import (
              ModelParameters,
              potential,
              potential_grad,
              auxiliaries,
              rhs,
          )

          from locked_saturation.validation import locked_arithmetic

          expected = "/src/locked_saturation/"

          for module in (
              locked_saturation,
              locked_saturation.model,
              locked_saturation.validation,
          ):
              path = module.__file__.replace("\\", "/")
              print(path)
              assert expected in path, path

          result = locked_arithmetic()
          assert isinstance(result, dict)

          ModelParameters()

          print("Locked Saturation imports PASS")
          PY

      - name: Run Locked Saturation tests in isolated directory
        run: |
          set -euo pipefail

          test_dir="$RUNNER_TEMP/locked-saturation-tests"

          rm -rf "$test_dir"
          mkdir -p "$test_dir"

          cp "$GITHUB_WORKSPACE/test_model.py" "$test_dir/"
          cp "$GITHUB_WORKSPACE/test_locked_arithmetic.py" "$test_dir/"

          cd "$test_dir"

          echo "Working directory:"
          pwd

          echo "Test files:"
          ls -la

          test ! -e "__init__.py"

          python -m pytest \
            --rootdir="$test_dir" \
            --import-mode=importlib \
            -q \
            test_model.py \
            test_locked_arithmetic.py

          echo "Locked Saturation tests PASS"

      - name: Compile Locked Saturation Python sources
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          python -m compileall -q src/locked_saturation
          python -m py_compile \
            test_model.py \
            test_locked_arithmetic.py

          echo "Python compilation PASS"

      - name: Install Fortran build toolchain
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gfortran make git curl

          gfortran --version
          make --version

      - name: Fetch forutils
        run: |
          set -euo pipefail

          rm -rf "$FORUTILSPATH"

          git clone \
            --depth=1 \
            https://github.com/cmbant/forutils.git \
            "$FORUTILSPATH"

          test -f "$FORUTILSPATH/Makefile"

      - name: Restore RungeKuttaDP45 if required
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if [ ! -s RungeKuttaDP45.f90 ]; then
            curl \
              --fail \
              --location \
              https://raw.githubusercontent.com/cmbant/CAMB/2.0.1/fortran/RungeKuttaDP45.f90 \
              --output RungeKuttaDP45.f90
          fi

          test -s RungeKuttaDP45.f90

      - name: Prepare CAMB build directories
        run: |
          set -euo pipefail

          rm -rf "$CAMB_BUILD_DIR" "$PYCAMB_OUTPUT_DIR"

          mkdir -p \
            "$CAMB_BUILD_DIR/forutils/Releaselib" \
            "$CAMB_BUILD_DIR/forutils/Debuglib" \
            "$CAMB_BUILD_DIR/forutils/Release" \
            "$CAMB_BUILD_DIR/forutils/Debug" \
            "$CAMB_BUILD_DIR/camb/Releaselib" \
            "$CAMB_BUILD_DIR/camb/Debuglib" \
            "$CAMB_BUILD_DIR/camb/Release" \
            "$CAMB_BUILD_DIR/camb/Debug" \
            "$PYCAMB_OUTPUT_DIR"

      - name: Build full CAMB Fortran library
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR"

          test -s "$PYCAMB_OUTPUT_DIR/camblib.so"

          ls -lh "$PYCAMB_OUTPUT_DIR/camblib.so"
          file "$PYCAMB_OUTPUT_DIR/camblib.so"

          echo "FULL CAMB FORTRAN BUILD PASS"

      - name: Push validated cleanup branch
        if: steps.cleanup_commit.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git push \
            --set-upstream \
            origin \
            "$CLEANUP_BRANCH"

          echo "Validated branch pushed: $CLEANUP_BRANCH"

      - name: Final summary
        run: |
          echo "========================================"
          echo "REPOSITORY CLEANUP VALIDATION COMPLETE"
          echo "========================================"
          echo "Workflow: $WORKFLOW_VERSION"
          echo "Python imports: PASS"
          echo "Locked Saturation tests: PASS"
          echo "Python compilation: PASS"
          echo "CAMB Fortran build: PASS"
