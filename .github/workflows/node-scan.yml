name: Node 20 scan (repo-wide)

# Scans the repository for exact occurrences of 'node-version: 20' and 'actions/setup-node'
# Uploads a node_version_report.txt artifact with the findings.

on:
  push:
    branches: [ fix/update-node-version ]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repo scan for Node 20 and setup-node
        run: |
          set -euo pipefail
          echo "Scanning repository for 'node-version: 20' and 'actions/setup-node'..."
          mkdir -p repo-scan-output
          {
            echo "=== node-version: 20 matches ==="
            git grep -n -- "node-version: 20" || true
            echo "\n=== actions/setup-node matches ==="
            git grep -n -- "actions/setup-node" || true
            echo "\n=== any 'node-version:' lines for context ==="
            git grep -n -- "node-version:" || true
          } > repo-scan-output/node_version_report.txt || true
          echo "Scan complete. Results saved to repo-scan-output/node_version_report.txt"

      - name: Upload node_version_report.txt
        uses: actions/upload-artifact@v4
        with:
          name: node-version-report
          path: repo-scan-output/node_version_report.txt
