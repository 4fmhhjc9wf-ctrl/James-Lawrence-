name: Validate Locked Saturation Package Installation

on:
  workflow_dispatch:
  push:
    branches:
      - restore-locked-saturation-package

jobs:
  validate:
    name: Test locked_saturation with editable install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Install Python build tools and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest numpy scipy

      - name: Editable install of package
        run: |
          python -m pip install -e .

      - name: Verify CAMB imports
        run: |
          python -c "import camb; print('CAMB import PASS:', camb.__file__)"

      - name: Verify locked_saturation model imports
        run: |
          python -c "from locked_saturation.model import ModelParameters, potential, potential_grad, auxiliaries, rhs; print('model import PASS')"

      - name: Verify locked_saturation validation imports
        run: |
          python -c "from locked_saturation.validation import locked_arithmetic; print('validation import PASS')"

      - name: Prepare isolated test directory
        run: |
          mkdir -p /tmp/locked-saturation-tests
          cp test_model.py /tmp/locked-saturation-tests/
          cp test_locked_arithmetic.py /tmp/locked-saturation-tests/
          echo "Test files copied to /tmp/locked-saturation-tests"
          ls -la /tmp/locked-saturation-tests/

      - name: Run pytest from isolated directory
        run: |
          cd /tmp/locked-saturation-tests
          pytest -q test_model.py test_locked_arithmetic.py
