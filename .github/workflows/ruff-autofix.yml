name: Ruff autofix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply fixes to'
        required: true
        default: 'fix/repo-health'

permissions:
  contents: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run ruff rewrite (autofix)
        id: ruff
        run: |
          set -e
          echo "Running ruff rewrite..."
          ruff rewrite . || true
          # Show git status for debugging
          git status --porcelain

      - name: Commit and push autofix changes
        if: ${{ steps.ruff.outcome == 'success' }}
        run: |
          # Only commit/push if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply ruff autofixes" || echo "No changes to commit"
            git push origin HEAD:${{ github.event.inputs.branch }}
          else
            echo "No changes from ruff rewrite"
          fi
