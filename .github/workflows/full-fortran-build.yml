        env:
          FORUTILSPATH: ${{ github.workspace }}/../forutils
          CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
        run: |
          set -euo pipefail

          rm -rf "$CAMB_BUILD_DIR"
          mkdir -p "$CAMB_BUILD_DIR"

          rm -rf "${{ runner.temp }}/pycamb-output"
          mkdir -p "${{ runner.temp }}/pycamb-output"

          echo "========================================"
          echo "STARTING FULL FORTRAN BUILD"
          echo "========================================"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="${{ runner.temp }}/pycamb-output"

      - name: Verify compiled library
