name: Full CAMB Fortran build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-fortran-build.yml"

jobs:
  full-fortran-build:
    name: Full recovered Fortran build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran make git curl
          gfortran --version
          make --version

      - name: Fetch forutils
        run: |
          set -euo pipefail
          rm -rf ../forutils
          git clone --depth=1 https://github.com/cmbant/forutils.git ../forutils
          test -s ../forutils/Makefile
          echo "FORUTILS CHECKOUT PASS"

      - name: Audit and restore required CAMB 2.0.1 sources
        run: |
          set -euo pipefail

          required_files=(
            constants.f90
            config.f90
            classes.f90
            MathUtils.f90
            RungeKuttaDP45.f90
            DarkAge21cm.f90
            DarkEnergyInterface.f90
            SourceWindows.f90
            massive_neutrinos.f90
            model.f90
            results.f90
            bessels.f90
            hyperspherical_bessels.f90
            hyperspherical_bessels_airy.f90
            hyperspherical_bessels_smallnu.f90
            hyperspherical_bessels_olver.f90
            recfast.f90
            DarkEnergyFluid.f90
            DarkEnergyPPF.f90
            PowellMinimize.f90
            DarkEnergyQuintessence.f90
            equations.f90
            reionization.f90
            InitialPower.f90
            halofit.f90
            SPkNonLinear.f90
            SecondOrderPK.f90
            ExternalNonLinearRatio.f90
            lensing.f90
            SeparableBispectrum.f90
            cmbmain.f90
            camb.f90
            camb_python.f90
          )

          missing=()

          for f in "${required_files[@]}"; do
            if [ -s "$f" ]; then
              echo "PRESENT  $f"
            else
              echo "MISSING  $f"
              missing+=("$f")
            fi
          done

          echo "Required source files: ${#required_files[@]}"
          echo "Missing source files: ${#missing[@]}"

          for f in "${missing[@]}"; do
            url="https://raw.githubusercontent.com/cmbant/CAMB/2.0.1/fortran/$f"
            echo "Restoring $f from official CAMB 2.0.1"

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              "$url" \
              --output "$f"

            test -s "$f"
          done

          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "STILL MISSING  $f"
              exit 1
            fi
          done

          echo "ALL REQUIRED FORTRAN SOURCES PRESENT"

      - name: Verify locked saturation include
        run: |
          set -euo pipefail
          test -s sat_locked_background.inc
          grep -n "sat_locked_background.inc" equations.f90
          echo "LOCKED SATURATION INCLUDE PASS"

      - name: Verify build configuration
        run: |
          set -euo pipefail
          test -s Makefile
          test -s Makefile_main
          test -s ../forutils/Makefile
          grep -q "RungeKuttaDP45" Makefile_main
          echo "BUILD CONFIGURATION CHECK PASS"

      - name: Dry-run Make dependency resolution
        env:
          FORUTILSPATH: ${{ github.workspace }}/../forutils
          CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          mkdir -p "$CAMB_BUILD_DIR" "$PYCAMB_OUTPUT_DIR"

          make -n python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR" \
            > /tmp/camb-make-dry-run.txt

          test -s /tmp/camb-make-dry-run.txt

          echo "MAKE DEPENDENCY RESOLUTION PASS"

      - name: Build recovered Fortran library
        env:
          FORUTILSPATH: ${{ github.workspace }}/../forutils
          CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          rm -rf "$CAMB_BUILD_DIR" "$PYCAMB_OUTPUT_DIR"
          mkdir -p "$CAMB_BUILD_DIR" "$PYCAMB_OUTPUT_DIR"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR"

      - name: Verify compiled library
        env:
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          library="$PYCAMB_OUTPUT_DIR/camblib.so"

          if [ ! -s "$library" ]; then
            echo "Expected library was not produced: $library"

            find \
              "${{ runner.temp }}" \
              "${{ github.workspace }}" \
              -type f \
              -name 'camblib.so' \
              -print \
              2>/dev/null || true

            exit 1
          fi

          ls -lh "$library"
          file "$library"

          echo "FULL FORTRAN BUILD PASS"
