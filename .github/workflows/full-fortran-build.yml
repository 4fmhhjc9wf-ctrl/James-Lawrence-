name: Full CAMB Fortran build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-fortran-build.yml"

jobs:
  full-fortran-build:
    name: Full recovered Fortran build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gfortran make git curl

          echo "=== COMPILER ==="
          gfortran --version

          echo "=== MAKE ==="
          make --version

      - name: Fetch forutils
        run: |
          set -euo pipefail

          rm -rf ../forutils

          git clone \
            --depth=1 \
            https://github.com/cmbant/forutils.git \
            ../forutils

          test -s ../forutils/Makefile

          echo "FORUTILS CHECKOUT PASS"

      - name: Audit and restore required CAMB 2.0.1 sources
        run: |
          set -euo pipefail

          required_files=(
            constants.f90
            config.f90
            classes.f90
            MathUtils.f90
            RungeKuttaDP45.f90
            DarkAge21cm.f90
            DarkEnergyInterface.f90
            SourceWindows.f90
            massive_neutrinos.f90
            model.f90
            results.f90
            bessels.f90
            hyperspherical_bessels.f90
            hyperspherical_bessels_airy.f90
            hyperspherical_bessels_smallnu.f90
            hyperspherical_bessels_olver.f90
            recfast.f90
            DarkEnergyFluid.f90
            DarkEnergyPPF.f90
            PowellMinimize.f90
            DarkEnergyQuintessence.f90
            equations.f90
            reionization.f90
            InitialPower.f90
            halofit.f90
            SPkNonLinear.f90
            SecondOrderPK.f90
            ExternalNonLinearRatio.f90
            lensing.f90
            SeparableBispectrum.f90
            cmbmain.f90
            camb.f90
            camb_python.f90
          )

          missing=()

          echo "========================================"
          echo "CAMB REQUIRED SOURCE AUDIT"
          echo "========================================"

          for f in "${required_files[@]}"; do
            if [ -s "$f" ]; then
              echo "PRESENT  $f"
            else
              echo "MISSING  $f"
              missing+=("$f")
            fi
          done

          echo
          echo "Required source files: ${#required_files[@]}"
          echo "Missing source files: ${#missing[@]}"

          for f in "${missing[@]}"; do
            url="https://raw.githubusercontent.com/cmbant/CAMB/2.0.1/fortran/$f"

            echo "Restoring $f from official CAMB 2.0.1"

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              "$url" \
              --output "$f"

            test -s "$f"
            echo "RESTORED  $f"
          done

          echo
          echo "=== FINAL SOURCE CHECK ==="

          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "STILL MISSING  $f"
              exit 1
            fi
          done

          echo "ALL REQUIRED FORTRAN SOURCES PRESENT"

      - name: Verify locked saturation include
        run: |
          set -euo pipefail

          test -s sat_locked_background.inc

          if ! grep -n "sat_locked_background.inc" equations.f90; then
            echo "equations.f90 does not reference sat_locked_background.inc"
            exit 1
          fi

          echo "LOCKED SATURATION INCLUDE PASS"

      - name: Verify build configuration
        run: |
          set -euo pipefail

          test -s Makefile
          test -s Makefile_main
          test -s ../forutils/Makefile

          if ! grep -q "RungeKuttaDP45" Makefile_main; then
            echo "RungeKuttaDP45 is not listed in Makefile_main"
            exit 1
          fi

          echo "BUILD CONFIGURATION CHECK PASS"

      - name: Prepare complete build directory tree
        env:
          CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          rm -rf "$CAMB_BUILD_DIR"
          rm -rf "$PYCAMB_OUTPUT_DIR"

          mkdir -p "$CAMB_BUILD_DIR/forutils/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Release"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debug"

          mkdir -p "$CAMB_BUILD_DIR/camb/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Release"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debug"

          mkdir -p "$PYCAMB_OUTPUT_DIR"

          echo "========================================"
          echo "BUILD DIRECTORY TREE"
          echo "========================================"

          find "$CAMB_BUILD_DIR" \
            -maxdepth 3 \
            -type d \
            -print

          test -d "$CAMB_BUILD_DIR/forutils/Releaselib"
          test -d "$CAMB_BUILD_DIR/camb/Releaselib"
          test -d "$PYCAMB_OUTPUT_DIR"

          echo "BUILD DIRECTORY PREPARATION PASS"

      - name: Dry-run Make dependency resolution
        env:
          FORUTILSPATH: ${{ github.workspace }}/../forutils
          CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          echo "========================================"
          echo "MAKE DRY RUN"
          echo "========================================"

          make -n python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR" \
            > /tmp/camb-make-dry-run.txt

          test -s /tmp/camb-make-dry-run.txt

          echo "=== FIRST 100 LINES ==="
          head -100 /tmp/camb-make-dry-run.txt

          echo
          echo "MAKE DEPENDENCY RESOLUTION PASS"

      - name: Build recovered Fortran library
        env:
          FORUTILSPATH: ${{ github.workspace }}/../forutils
          CAMB_BUILD_DIR: ${{ runner.temp }}/camb-build
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          mkdir -p "$CAMB_BUILD_DIR/forutils/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Release"
          mkdir -p "$CAMB_BUILD_DIR/forutils/Debug"

          mkdir -p "$CAMB_BUILD_DIR/camb/Releaselib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debuglib"
          mkdir -p "$CAMB_BUILD_DIR/camb/Release"
          mkdir -p "$CAMB_BUILD_DIR/camb/Debug"

          mkdir -p "$PYCAMB_OUTPUT_DIR"

          echo "========================================"
          echo "STARTING FULL CAMB FORTRAN BUILD"
          echo "========================================"

          echo "FORUTILSPATH=$FORUTILSPATH"
          echo "CAMB_BUILD_DIR=$CAMB_BUILD_DIR"
          echo "PYCAMB_OUTPUT_DIR=$PYCAMB_OUTPUT_DIR"

          make python \
            FORUTILSPATH="$FORUTILSPATH" \
            CAMB_BUILD_DIR="$CAMB_BUILD_DIR" \
            PYCAMB_OUTPUT_DIR="$PYCAMB_OUTPUT_DIR"

          echo
          echo "MAKE COMMAND COMPLETED"

      - name: Verify compiled library
        env:
          PYCAMB_OUTPUT_DIR: ${{ runner.temp }}/pycamb-output
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING COMPILED LIBRARY"
          echo "========================================"

          library="$PYCAMB_OUTPUT_DIR/camblib.so"

          if [ ! -s "$library" ]; then
            echo "Expected camblib.so was not produced at:"
            echo "$library"

            echo
            echo "Searching runner for camblib.so..."

            find \
              "${{ runner.temp }}" \
              "${{ github.workspace }}" \
              -type f \
              -name "camblib.so" \
              -print \
              2>/dev/null || true

            echo
            echo "Contents of Python output directory:"

            find \
              "$PYCAMB_OUTPUT_DIR" \
              -maxdepth 2 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "FOUND:"
          ls -lh "$library"

          echo
          echo "FILE TYPE:"
          file "$library"

          echo
          echo "========================================"
          echo "FULL FORTRAN BUILD PASS"
          echo "========================================"
