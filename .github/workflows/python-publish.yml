name: Upload Python Package (DISABLED)

# This workflow is disabled and will not run automatically.
# It remains in the repository for reference and possible future use if PyPI publishing becomes needed.
# To re-enable, set `if: false` to `if: true` or remove the condition.

on:
  release:
    types: [published]

jobs:
  release-build:
    if: false  # DISABLED - workflow will not execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    if: false  # DISABLED - workflow will not execute
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
