name: Block Node 20 in workflows

# Proactive check to prevent adding workflows or files that pin Node 20.
# Runs on pull requests and fails if any file contains an exact `node-version: 20`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-node-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search for node-version: 20
        run: |
          set -euo pipefail
          echo "Scanning repository for exact occurrences of 'node-version: 20'..."
          # Search YAML and workflow files; allow the command to succeed with no matches
          matches=$(git grep -n -- "node-version: 20" || true)
          if [ -n "$matches" ]; then
            echo "Found disallowed 'node-version: 20' occurrences:" >&2
            echo "$matches" >&2
            echo "\nPlease update to a supported Node LTS (e.g. 18 or 22) or pin actions/setup-node to a maintained major." >&2
            exit 1
          fi
          echo "No exact 'node-version: 20' occurrences found."

      - name: Optional: search for actions/setup-node usage
        run: |
          git grep -n -- "actions/setup-node" || true
