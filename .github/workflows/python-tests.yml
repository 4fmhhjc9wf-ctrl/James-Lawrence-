name: CI — Locked Saturation validation

on:
  push:
    branches: [main, fix/repo-health]
  pull_request:
    branches: [main]

jobs:
  locked-saturation-tests:
    name: Locked Saturation — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy sympy packaging

      - name: Verify locked-saturation model import
        run: |
          python -c "from locked_saturation.model import ModelParameters, potential, potential_grad, auxiliaries, rhs; print('locked_saturation.model import PASS')"

      - name: Verify locked arithmetic import
        run: |
          python -c "from locked_saturation.validation import locked_arithmetic; print('locked arithmetic import PASS')"

      - name: Run locked model tests
        run: |
          mkdir -p /tmp/locked-saturation-tests
          cp test_model.py /tmp/locked-saturation-tests/
          cp test_locked_arithmetic.py /tmp/locked-saturation-tests/
          cd /tmp/locked-saturation-tests
          pytest -q test_model.py test_locked_arithmetic.py

  repository-python-syntax:
    name: Repository Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Compile locked-saturation Python sources
        run: |
          python -m compileall -q src/locked_saturation
          python -m py_compile test_model.py
          python -m py_compile test_locked_arithmetic.py

  fortran-toolchain:
    name: Fortran toolchain check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Verify Fortran compiler
        run: |
          gfortran --version
          make --version

      - name: Verify recovered Fortran sources are present
        run: |
          count=$(git ls-files '*.f90' '*.f' '*.f95' | wc -l)
          echo "Fortran source files found: $count"
          test "$count" -gt 0
